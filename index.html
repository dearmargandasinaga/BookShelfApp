<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookshelf App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="text-center mb-4">📚 My Bookshelf</h2>

    <form id="bookForm" class="row g-3">
      <div class="col-md-3">
        <input type="text" class="form-control" id="titleInput" placeholder="Book Title" required>
      </div>
      <div class="col-md-2">
        <input type="text" class="form-control" id="authorInput" placeholder="Author" required>
      </div>
      <div class="col-md-2">
        <select class="form-select" id="statusInput">
          <option value="unread">Unread</option>
          <option value="reading">Reading</option>
          <option value="finished">Finished</option>
        </select>
      </div>
      <div class="col-md-3">
        <input type="date" class="form-control" id="dateInput" required>
      </div>
      <div class="col-md-2 d-grid">
        <button type="submit" class="btn btn-primary">Add Book</button>
      </div>
    </form>

    <div class="my-4">
      <input type="text" id="searchInput" class="form-control" placeholder="Search by title or author...">
    </div>

    <ul class="nav nav-tabs mb-3" id="filterTabs">
      <li class="nav-item">
        <button class="nav-link active" data-filter="all">All</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-filter="unread">Unread</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-filter="reading">Reading</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-filter="finished">Finished</button>
      </li>
    </ul>

    <div id="bookList" class="row row-cols-1 row-cols-md-2 g-4"></div>
  </div>

  <script>
    const bookForm = document.getElementById("bookForm");
    const titleInput = document.getElementById("titleInput");
    const authorInput = document.getElementById("authorInput");
    const statusInput = document.getElementById("statusInput");
    const dateInput = document.getElementById("dateInput");
    const bookList = document.getElementById("bookList");
    const searchInput = document.getElementById("searchInput");
    const filterTabs = document.querySelectorAll("#filterTabs button");

    let books = JSON.parse(localStorage.getItem("bookshelf")) || [];
    let currentFilter = "all";

    function renderBooks() {
      bookList.innerHTML = "";
      const search = searchInput.value.toLowerCase();
      books
        .filter(book => {
          return (
            (currentFilter === "all" || book.status === currentFilter) &&
            (book.title.toLowerCase().includes(search) || book.author.toLowerCase().includes(search))
          );
        })
        .forEach((book, index) => {
          const card = document.createElement("div");
          card.className = "col";
          card.innerHTML = `
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                <h5 class="card-title">${book.title}</h5>
                <p class="card-text">by ${book.author}</p>
                <p class="card-text"><small class="text-muted">Read on: ${book.date}</small></p>
                <span class="badge bg-${getStatusColor(book.status)}">${book.status}</span>
                <div class="mt-2">
                  <button class="btn btn-sm btn-danger" onclick="deleteBook(${index})">Delete</button>
                </div>
              </div>
            </div>
          `;
          bookList.appendChild(card);
        });
    }

    function getStatusColor(status) {
      return status === "unread" ? "secondary" : status === "reading" ? "warning" : "success";
    }

    function deleteBook(index) {
      books.splice(index, 1);
      updateBooks();
    }

    function updateBooks() {
      localStorage.setItem("bookshelf", JSON.stringify(books));
      renderBooks();
    }

    bookForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const newBook = {
        title: titleInput.value.trim(),
        author: authorInput.value.trim(),
        status: statusInput.value,
        date: dateInput.value
      };
      books.push(newBook);
      titleInput.value = "";
      authorInput.value = "";
      statusInput.value = "unread";
      dateInput.value = "";
      updateBooks();
    });

    searchInput.addEventListener("input", renderBooks);

    filterTabs.forEach(tab => {
      tab.addEventListener("click", () => {
        filterTabs.forEach(btn => btn.classList.remove("active"));
        tab.classList.add("active");
        currentFilter = tab.getAttribute("data-filter");
        renderBooks();
      });
    });

    renderBooks();
  </script>
</body>
</html>
